{% load static %}

<!DOCTYPE html>
<html lang="us-EN">
	<head>
		<title>Student Information</title>
		<!--Metadata for the HTML file, including the character set and the Page Title -->
		<meta charset="utf-8" />
		
		<!--Link to the Bootstrap CDN -->
		<meta name="viewpoint" content="width=device-width, initial-scale=1" />
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
		
		<!--Link to the Font Awesome CDN -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
		
		<!--Link to the JQuery CDN -->
		<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
		
	</head>
	<body>
		
		<!-- Create navigation bar to appear at the top of each page-->
		<!-- The navigation bar has four links: dashboard, student details, course details, and enrollment--> 
		<header class="navbar navbar-expand bg-dark">
			<a href="{% url 'dashboard' %}" class="navbar-brand text-white">Student Information</a>
			<ul class="navbar-nav">
				<li class="nav-item">
					<a class="nav-link text-white" href="{% url 'dashboard' %}">Dashboard</a>
				</li>
				<li class="nav-item">
					<a class="nav-link text-white" href="{% url 'studentdetails' %}">Student Details</a>
				</li>
				<li class="nav-item">
					<a class="nav-link text-white" href="{% url 'coursedetails' %}">Course Details</a>
				</li>
				<li class="nav-item">
					<a class="nav-link text-white" href="{% url 'enrollment' %}">Enrollment</a>
				</li>					
			</ul>
			
			<!-- If user is not authenticated, display the Login button in the upper right hand corner -->
			{% if not user.is_authenticated %}
			
			<ul class="navbar-nav ms-auto">
				<li class="nav-item">
					<a class="btn btn-sm btn-secondary" href="{% url 'login' %}">Login</a>
				</li>
			</ul>
			
			{% else %}
			
			<!-- If user is authenticated, display the Logout button in the upper right hand corner -->
			<ul class="navbar-nav ms-auto">
				<li class="nav-item">
					<a class="btn btn-sm btn-secondary" href="{% url 'logout' %}">Logout</a>
				</li>
			</ul>
			
			{% endif %}
			
		</header>

		{% block container %}
		
		<!-- Used in conjunction with extending base.html to other html files-->
		<div>
		
			{% block content %}
			
			{% endblock %}
			
		</div>
		
		{% endblock %}
	</body>
</html>
